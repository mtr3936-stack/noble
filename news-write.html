<span class="font-label-md text-label-md font-bold text-foreground-strong">카테고리</span>
<select class="field" id="category"></select>
</label>
<label class="flex flex-col gap-1.5">
<span class="font-label-md text-label-md font-bold text-foreground-strong">작성일</span>
<input class="field" id="date" required type="date">
</label>
</div>
<label class="flex flex-col gap-1.5">
<span class="font-label-md text-label-md font-bold text-foreground-strong">제목</span>
<input class="field" id="title" maxlength="120" placeholder="게시글 제목을 입력하세요" required type="text">
</label>
<label class="flex flex-col gap-1.5">
<span class="font-label-md text-label-md font-bold text-foreground-strong">대표 이미지 주소 <span class="font-normal text-muted">(선택)</span></span>
<input class="field" id="thumbnail" inputmode="url" placeholder="https://… 또는 images/photo.jpg" type="text">
</label>
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between gap-space-sm">
<span class="font-label-md text-label-md font-bold text-foreground-strong">본문 <span class="font-normal text-muted">(마크다운)</span></span>
<div class="inline-flex p-1 rounded-full bg-surface-container-low" role="tablist">
<button aria-selected="true" class="tab-btn h-11 min-w-[64px] px-3 rounded-full font-label-sm text-label-sm bg-surface-canvas text-foreground-strong shadow-sm" data-tab="edit" role="tab" type="button">작성</button>
<button aria-selected="false" class="tab-btn h-11 min-w-[64px] px-3 rounded-full font-label-sm text-label-sm text-muted" data-tab="preview" role="tab" type="button">미리보기</button>
</div>
</div>
<textarea class="field min-h-[320px]" id="content" placeholder="## 소제목&#10;&#10;본문을 마크다운으로 작성하세요. **굵게**, *기울임*, - 목록, > 인용, [링크](https://…)" required></textarea>
<div class="hidden md-body min-h-[320px] rounded-DEFAULT border border-border-hairline p-space-lg bg-surface-canvas" id="preview"></div>
<p class="font-label-sm text-label-sm text-muted">제목 <code>#</code>, 목록 <code>-</code>·<code>1.</code>, <code>**굵게**</code>, <code>*기울임*</code>, <code>~~취소선~~</code>, <code>`코드`</code>, <code>```코드블록```</code>, <code>&gt;</code> 인용, <code>[텍스트](url)</code>, <code>---</code> 구분선을 지원합니다.</p>
</div>

<p class="hidden px-space-md py-space-sm rounded-DEFAULT bg-error-container text-on-error-container font-body-sm text-body-sm" id="form-error"></p>

<div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-space-sm">
<a class="h-12 px-space-xl rounded-full bg-surface-container-low hover:bg-surface-container text-foreground-strong font-label-md text-label-md inline-flex items-center justify-center transition-colors" href="admin.html">취소</a>
<button class="h-12 px-space-xl rounded-full bg-primary-container hover:bg-interactive-focus-ring text-on-primary font-title-md text-title-md inline-flex items-center justify-center gap-1.5 shadow-sm transition-colors disabled:opacity-60" id="save-btn" type="submit"><span class="material-symbols-outlined text-[20px]">check</span><span id="save-label">저장하기</span></button>
</div>

<nav class="md:hidden fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-canvas/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.04)]" id="bottom-nav">
<div class="flex justify-around items-center h-16 px-space-xs max-w-md mx-auto">
<a class="flex flex-col items-center justify-center gap-0.5 w-16 h-12 text-on-surface-variant hover:text-on-surface transition-colors" href="index.html"><span class="material-symbols-outlined text-[24px]">real_estate_agent</span><span class="font-label-sm text-label-sm">추천매물</span></a>
<a class="flex flex-col items-center justify-center gap-0.5 w-16 h-12 text-on-surface-variant hover:text-on-surface transition-colors" href="news.html"><span class="material-symbols-outlined text-[24px]">newspaper</span><span class="font-label-sm text-label-sm">부동산소식</span></a>
<a aria-current="page" class="flex flex-col items-center justify-center gap-0.5 w-16 h-12 transition-colors text-primary font-bold" href="admin.html"><span class="material-symbols-outlined text-[24px]">dashboard</span><span class="font-label-sm text-label-sm">관리</span></a>
</div>
</nav>

<script>
(function () {
  if (!isAdmin()) return;
  const id = new URLSearchParams(location.search).get("id") || "";
  const form = document.getElementById("post-form");
  const fields = {
    category: document.getElementById("category"),
    date: document.getElementById("date"),
    title: document.getElementById("title"),
    thumbnail: document.getElementById("thumbnail"),
    content: document.getElementById("content")
  };
  const preview = document.getElementById("preview");
  const errorEl = document.getElementById("form-error");
  const saveBtn = document.getElementById("save-btn");
  const saveLabel = document.getElementById("save-label");
  const bottomNav = document.getElementById("bottom-nav");
  let original = null;

  function setCategories(extra) {
    const list = BOARD_CATEGORIES.slice();
    if (extra && !list.includes(extra)) list.push(extra);
    fields.category.innerHTML = list.map(c => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + "</option>").join("");
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.toggle("hidden", !msg);
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const isPreview = btn.getAttribute("data-tab") === "preview";
      document.querySelectorAll(".tab-btn").forEach(b => {
        const active = b === btn;
        b.setAttribute("aria-selected", active ? "true" : "false");
        b.classList.toggle("bg-surface-canvas", active);
        b.classList.toggle("text-foreground-strong", active);
        b.classList.toggle("shadow-sm", active);
        b.classList.toggle("text-muted", !active);
      });
      if (isPreview) {
        preview.innerHTML = fields.content.value.trim() ? renderMarkdown(fields.content.value) : '<p class="text-muted">미리 볼 내용이 없습니다.</p>';
      }
      fields.content.classList.toggle("hidden", isPreview);
      preview.classList.toggle("hidden", !isPreview);
    });
  });

  document.addEventListener("focusin", e => {
    if (e.target.matches("input, textarea, select")) bottomNav.classList.add("hidden");
  });
  document.addEventListener("focusout", () => {
    setTimeout(() => {
      if (!document.activeElement || !document.activeElement.matches("input, textarea, select")) bottomNav.classList.remove("hidden");
    }, 50);
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    showError("");
    const post = Object.assign({}, original || {}, {
      id: id,
      category: fields.category.value,
      date: fields.date.value || todayString(),
      title: fields.title.value.trim(),
      thumbnail: fields.thumbnail.value.trim(),
      content: fields.content.value
    });
    if (!post.title) return showError("제목을 입력해 주세요.");
    if (!post.content.trim()) return showError("본문을 입력해 주세요.");
    if (post.thumbnail && !safeImageUrl(post.thumbnail)) return showError("대표 이미지 주소는 https:// 로 시작하는 주소나 사이트 안의 파일 경로만 사용할 수 있습니다.");

    saveBtn.disabled = true;
    saveLabel.textContent = "저장 중…";
    try {
      const saved = await savePost(post);
      location.href = "news-detail.html?id=" + encodeURIComponent(saved.id);
    } catch (err) {
      showError(err.message);
      if (!isAdmin()) setTimeout(() => location.replace("admin.html"), 1500);
      saveBtn.disabled = false;
      saveLabel.textContent = id ? "수정 완료" : "저장하기";
    }
  });

  loadConfig().then(cfg => {
    const notice = document.getElementById("mode-notice");
    if (!cfg.api) {
      notice.textContent = "로컬 미리보기 모드입니다. 저장한 글은 이 브라우저에만 보관되며, Vercel 배포 후에는 GitHub 저장소에 저장됩니다.";
      notice.classList.remove("hidden");
    } else if (!cfg.github_ready) {
      notice.textContent = "Vercel 환경 변수 GITHUB_TOKEN이 설정되지 않아 저장할 수 없습니다.";
      notice.className = "mb-space-md px-space-md py-space-sm rounded-DEFAULT bg-error-container text-on-error-container font-body-sm text-body-sm";
    }
  });

  setCategories();
  fields.date.value = todayString();

  if (id) {
    document.getElementById("page-title").textContent = "글 수정";
    saveLabel.textContent = "수정 완료";
    document.title = "글 수정 | 혁신노블부동산";
    saveBtn.disabled = true;
    getPost(id).then(post => {
      if (!post) {
        showError("수정할 게시글을 찾을 수 없습니다.");
        return;
      }
      original = post;
      setCategories(post.category);
      fields.category.value = post.category || BOARD_CATEGORIES[0];
      fields.date.value = String(post.date || "").slice(0, 10) || todayString();
      fields.title.value = post.title || "";
      fields.thumbnail.value = post.thumbnail || "";
      fields.content.value = post.content || "";
      saveBtn.disabled = false;
    }).catch(err => showError("게시글을 불러오지 못했습니다: " + err.message));
  }
})();
</script>
