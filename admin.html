<a aria-current="page" class="flex flex-col items-center justify-center gap-0.5 w-16 h-12 transition-colors text-primary font-bold" href="admin.html"><span class="material-symbols-outlined text-[24px]">dashboard</span><span class="font-label-sm text-label-sm">관리</span></a>
</div>

<script src="db.js"></script>
<script>
(function () {
  const loginView = document.getElementById("login-view");
  const dashboardView = document.getElementById("dashboard-view");

  function show(el) {
    el.classList.remove("hidden");
    el.classList.add("flex");
  }

  function setNotice(el, msg, isError) {
    el.textContent = msg;
    el.className = msg
      ? "mb-space-md px-space-md py-space-sm rounded-DEFAULT font-body-sm text-body-sm " + (isError ? "bg-error-container text-on-error-container" : "bg-primary-fixed text-on-primary-fixed-variant")
      : "hidden";
  }

  if (!isAdmin()) {
    show(loginView);
    const form = document.getElementById("login-form");
    const input = document.getElementById("password");
    const errorEl = document.getElementById("login-error");
    const hintEl = document.getElementById("login-hint");
    const btn = document.getElementById("login-btn");

    loadConfig().then(cfg => {
      if (!cfg.api) {
        hintEl.textContent = "로컬 미리보기 모드입니다. 기본 비밀번호 admin1234로 로그인할 수 있습니다.";
        hintEl.classList.remove("hidden");
      } else if (!cfg.admin_ready) {
        hintEl.textContent = "Vercel 환경 변수 ADMIN_PASSWORD가 설정되지 않았습니다.";
        hintEl.classList.remove("hidden");
      }
    });

    input.focus();
    form.addEventListener("submit", async e => {
      e.preventDefault();
      errorEl.classList.add("hidden");
      if (!input.value) {
        errorEl.textContent = "비밀번호를 입력해 주세요.";
        errorEl.classList.remove("hidden");
        return;
      }
      btn.disabled = true;
      try {
        const result = await login(input.value);
        if (result.ok) {
          location.reload();
          return;
        }
        errorEl.textContent = result.error || "비밀번호가 올바르지 않습니다.";
      } catch (err) {
        errorEl.textContent = "로그인 중 오류가 발생했습니다: " + err.message;
      }
      errorEl.classList.remove("hidden");
      input.select();
      btn.disabled = false;
    });
    return;
  }

  show(dashboardView);
  const tbody = document.getElementById("post-table-body");
  const countEl = document.getElementById("post-count");
  const noticeEl = document.getElementById("dashboard-notice");

  document.getElementById("logout-btn").addEventListener("click", () => {
    logout();
    location.reload();
  });

  loadConfig().then(cfg => {
    if (!cfg.api) setNotice(noticeEl, "로컬 미리보기 모드입니다. 글은 이 브라우저에만 저장되며, Vercel 배포 후에는 GitHub 저장소(" + cfg.github_owner + "/" + cfg.github_repo + ")에 저장됩니다.", false);
    else if (!cfg.github_ready) setNotice(noticeEl, "Vercel 환경 변수 GITHUB_TOKEN이 설정되지 않아 글을 저장할 수 없습니다.", true);
  });

  async function renderTable() {
    let posts = [];
    try {
      posts = await getPosts();
    } catch (e) {
      setNotice(noticeEl, "게시글을 불러오지 못했습니다: " + e.message, true);
    }
    countEl.textContent = "전체 " + posts.length + "개의 게시글";
    if (!posts.length) {
      tbody.innerHTML = '<tr><td class="px-4 py-12 text-center font-body-md text-body-md text-muted" colspan="5">작성된 게시글이 없습니다.</td></tr>';
      return;
    }
    tbody.innerHTML = posts.map((post, i) =>
      '<tr class="hover:bg-surface-container-low/60 transition-colors">' +
        '<td class="px-4 py-3 font-body-sm text-body-sm text-muted">' + (posts.length - i) + "</td>" +
        '<td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full font-caption text-caption font-bold whitespace-nowrap ' + categoryClass(post.category) + '">' + escapeHtml(post.category || "소식") + "</span></td>" +
        '<td class="px-4 py-3"><a class="font-body-md text-body-md font-semibold text-foreground-strong hover:text-primary line-clamp-1" href="news-detail.html?id=' + encodeURIComponent(post.id) + '">' + escapeHtml(post.title) + "</a></td>" +
        '<td class="px-4 py-3 font-body-sm text-body-sm text-foreground-secondary whitespace-nowrap">' + escapeHtml(formatDate(post.date)) + "</td>" +
        '<td class="px-4 py-3"><div class="flex justify-end gap-space-xs">' +
          '<a class="h-11 px-4 rounded-full bg-surface-container-high hover:bg-primary-fixed text-foreground-strong hover:text-primary font-label-md text-label-md inline-flex items-center gap-1 transition-colors" href="news-write.html?id=' + encodeURIComponent(post.id) + '"><span class="material-symbols-outlined text-[18px]">edit</span>수정</a>' +
          '<button class="delete-btn h-11 px-4 rounded-full bg-error-container text-on-error-container hover:bg-error hover:text-on-error font-label-md text-label-md inline-flex items-center gap-1 transition-colors disabled:opacity-60" data-id="' + escapeHtml(post.id) + '" type="button"><span class="material-symbols-outlined text-[18px]">delete</span>삭제</button>' +
        "</div></td>" +
      "</tr>"
    ).join("");
  }

  tbody.addEventListener("click", async e => {
    const btn = e.target.closest(".delete-btn");
    if (!btn) return;
    if (!confirm("이 게시글을 삭제할까요? 삭제하면 되돌릴 수 없습니다.")) return;
    btn.disabled = true;
    try {
      await deletePost(btn.getAttribute("data-id"));
      setNotice(noticeEl, "게시글을 삭제했습니다.", false);
      await renderTable();
    } catch (err) {
      setNotice(noticeEl, "삭제 실패: " + err.message, true);
      btn.disabled = false;
      if (!isAdmin()) setTimeout(() => location.reload(), 1500);
    }
  });

  renderTable();
})();
</script>
